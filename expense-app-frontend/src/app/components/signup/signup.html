<div class="auth-page">
  <div class="auth-card">
    <p class="auth-brand">Expense App</p>
    <h2>Create your account</h2>
    <p class="auth-sub">Employee signup — pick your manager and you're in.</p>

    <form (ngSubmit)="onSubmit()">
      <label>
        Full name
        <input
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          required
          maxlength="100"
          autocomplete="name"
          [class.field-invalid]="submitAttempted && fullNameInvalid"
        />
      </label>
      <label>
        Username
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          minlength="3"
          maxlength="20"
          pattern="[a-zA-Z0-9_]+"
          autocomplete="username"
          [class.field-invalid]="submitAttempted && usernameInvalid"
        />
        <span class="field-hint">3-20 characters: letters, numbers, underscores.</span>
      </label>
      <label>
        Manager
        <select
          [(ngModel)]="managerId"
          name="managerId"
          required
          [class.field-invalid]="submitAttempted && managerInvalid"
        >
          <option [ngValue]="null" disabled>Select your manager</option>
          <option *ngFor="let m of managers" [ngValue]="m.id">{{ m.fullName }}</option>
        </select>
      </label>
      <label>
        Password
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            autocomplete="new-password"
            [class.field-invalid]="submitAttempted && passwordInvalid"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.32 20.32 0 0 1-3.22 4.55M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </label>
      <label>
        Confirm password
        <div class="password-field">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            autocomplete="new-password"
            [class.field-invalid]="submitAttempted && confirmPasswordInvalid"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.32 20.32 0 0 1-3.22 4.55M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </label>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating account…' : 'Create account' }}
      </button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
