<div class="auth-page">
  <div class="auth-card">
    <p class="auth-brand">Expense App</p>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to submit, approve, or process expenses.</p>

    <form (ngSubmit)="onSubmit()">
      <label>
        Username
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          autocomplete="username"
          [class.field-invalid]="submitAttempted && !username.trim()"
        />
      </label>
      <label>
        Password
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
            [class.field-invalid]="submitAttempted && !password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.32 20.32 0 0 1-3.22 4.55M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </label>
      <button type="submit" [disabled]="submitting">{{ submitting ? 'Logging in…' : 'Log in' }}</button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="auth-switch">Employee, and don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</div>
